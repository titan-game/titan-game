/* === TITAN GRAPHICS UPGRADE === */

/* Более чёткие панели интерфейса */
.card, #hud, #nav, #fov, #t,
button {
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* Неоновое свечение кнопок */
button {
  transition:
    transform 0.18s ease,
    filter 0.18s ease,
    box-shadow 0.18s ease;
  box-shadow:
    0 0 8px rgba(70, 190, 255, 0.18),
    inset 0 0 8px rgba(255, 255, 255, 0.08);
}

/* Подсветка при нажатии */
button:active {
  transform: scale(0.94);
  filter: brightness(1.3);
}

/* Более объёмные панели */
.card {
  border-radius: 14px;
  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.18);
}

/* Плавное появление интерфейса */
#hud, #nav, #fov {
  animation: titanFadeIn 0.7s ease-out both;
}

@keyframes titanFadeIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Улучшенная читаемость текста */
body {
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

/* Уважение к настройке уменьшения анимации */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
